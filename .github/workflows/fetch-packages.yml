name: Fetch, Build & Deploy

on:
  schedule:
    # Run at midnight and noon UTC every day
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual runs
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    name: Fetch packages & build site
    # For PR close events we only need the preview job (to clean up)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Fetch package data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_packages.py

      - name: Assemble build directory
        run: |
          mkdir -p build
          cp index.html app.js style.css .nojekyll packages.json build/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  preview:
    name: Deploy / clean-up PR preview
    needs: [build]
    # Run for all PR events; for closed PRs the build job is skipped so we
    # use always() to allow this job to still run for cleanup.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Prepare build directory
        run: mkdir -p /tmp/build

      - name: Download preview artifact
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: /tmp/build

      - name: Deploy / clean-up preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: /tmp/build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
