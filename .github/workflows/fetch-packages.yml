name: Fetch Typst Package Data

on:
  schedule:
    # Run at midnight and noon UTC every day
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Fetch package data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_packages.py

      - name: Commit and push packages.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git diff --cached --quiet \
            && echo "packages.json unchanged – nothing to commit" \
            || (git commit -m "chore: update packages.json [skip ci]" && git push)
